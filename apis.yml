name: Protectt AI
description: >-
  Protectt.ai (Protectt.ai Labs Pvt Ltd) is an AI-native, full-stack mobile
  application security and fraud-control platform for Android and iOS. Its
  products — AppProtectt (RASP with 100+ runtime protections against hooking,
  spoofing, reverse engineering, tampering, MITM and SMS exploitation), SDKProtectt
  (SDK hardening/obfuscation), and ApiProtectt (API security) — embed as a
  lightweight SDK with zero performance overhead and no disruption to release
  cycles. The company targets banking, financial services and regulated
  enterprises (RBL Bank, Yes Bank, BSE, Bajaj Finserv, LIC), is ISO 27001 / ISO
  42001 / ISO 22301 and PCI DSS certified, and aligns to RBI, SEBI and NPCI
  security mandates. It is headquartered in Mumbai with offices in Dover
  (Delaware, US) and Dubai (UAE). Protectt.ai ships enterprise SDKs to customers
  rather than a public developer portal or open API — no OpenAPI, SDK registry
  package, or public API reference is published.
